[package]
name = "soar-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Agente SOAR basado en eBPF: observa y bloquea conexiones salientes en el kernel"

[dependencies]
soar-agent-common = { path = "../soar-agent-common", features = ["user"] }
anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
soar-agent-ebpf = { path = "../soar-agent-ebpf" }

[[bin]]
name = "soar-agent"
path = "src/main.rs"
