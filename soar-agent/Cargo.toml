[package]
name = "soar-agent"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Agente SOAR autonomo con enforcement eBPF y panel web de control"

[dependencies]
soar-agent-common = { path = "../soar-agent-common", features = ["user"] }
anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
axum = "0.8"
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
soar-agent-ebpf = { path = "../soar-agent-ebpf" }

[[bin]]
name = "soar-agent"
path = "src/main.rs"
